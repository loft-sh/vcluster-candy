name: Push head images

# The daily CVE scan reads ghcr.io/loft-sh/vcluster-candy:head, so it follows main.
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "pkg/**"
      - "cmd/**"
      - ".github/workflows/push-head-images.yaml"
  workflow_dispatch:

concurrency:
  group: push-head-images
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository_owner == 'loft-sh'

    name: Publish vcluster-candy head image

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write       # Required to push to GHCR
      id-token: write       # Required for Cosign keyless OIDC signing and provenance
      attestations: write   # Required to publish build provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v3.1.4"

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the current head image
        id: previous-head
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: record
          image: ghcr.io/${{ github.repository_owner }}/vcluster-candy

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push head image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-push-docker
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vcluster-candy:head

      - name: Sign head image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/vcluster-candy:head
          IMAGE_DIGEST: ${{ steps.build-push-docker.outputs.digest }}
        run: cosign sign --yes "${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Attest head image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vcluster-candy
          subject-digest: ${{ steps.build-push-docker.outputs.digest }}
          push-to-registry: true

      # Last step, so a failed build or push never deletes the image it replaces.
      - name: Delete the previous head image
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: delete
          image: ghcr.io/${{ github.repository_owner }}/vcluster-candy
          previous-digest: ${{ steps.previous-head.outputs.digest }}
          current-digest: ${{ steps.build-push-docker.outputs.digest }}
